name: Build APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/YTScheduler-v1.0.${{ github.run_number }}.apk"

      # Each build becomes a GitHub Release, so the APK can be downloaded on the phone from
      # github.com/mnameerturk/yt-scheduler/releases/latest
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.0.${{ github.run_number }}
          name: YT Scheduler v1.0.${{ github.run_number }}
          body: Download the .apk below and open it on your Android phone to install or update.
          files: android/out/*.apk
          make_latest: true
